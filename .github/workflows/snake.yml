# ═══════════════════════════════════════════════════════════════
#  Contribution Snake — Deep-Space Neon Edition 🐍
#  Location in your profile repo:
#  .github/workflows/snake.yml
#
#  It draws a snake that "eats" your contribution squares and
#  publishes the SVG to the `output` branch of this repo.
#  The profile README already points to that branch.
# ═══════════════════════════════════════════════════════════════

name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch:        # allow manual run from the Actions tab
  push:
    branches: [main]        # regenerate whenever the profile updates

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs (deep-space neon palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237c3aed&color_dots=%23e0e7ff%2C%23a5b4fc%2C%23818cf8%2C%234f46e5%2C%237c3aed
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23a78bfa&color_dots=%230b0e24%2C%23263a9e%2C%233b5bdb%2C%235a74f5%2C%23a5c8ff

      - name: Deploy SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
